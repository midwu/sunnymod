plugins {
    id 'fabric-loom' version '1.16-SNAPSHOT'
    id 'maven-publish'
}

// Read version parts from gradle.properties
def versionMajor = project.mod_version_major
def versionMinor = project.mod_version_minor
def versionBuild = project.mod_version_build

version = "${versionMajor}.${versionMinor}.${versionBuild}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "sunny-mod" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation 'com.google.code.gson:gson:2.10.1'
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:21.11.152"
    modImplementation "maven.modrinth:modmenu:17.0.0"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}

// Version bump helpers.
//   ./gradlew release        → 0.13.N → 0.13.N+1
//   ./gradlew releaseMinor   → 0.13.N → 0.14.0
//   ./gradlew releaseMajor   → 0.N.x  → 1.0.0

def bumpVersion = { String which ->
    def propsFile = file('gradle.properties')
    def props = new Properties()
    propsFile.withInputStream { props.load(it) }

    int major = props.getProperty('mod_version_major').toInteger()
    int minor = props.getProperty('mod_version_minor').toInteger()
    int build = props.getProperty('mod_version_build').toInteger()

    if (which == 'major') {
        major += 1; minor = 0; build = 0
    } else if (which == 'minor') {
        minor += 1; build = 0
    } else {
        build += 1
    }

    props.setProperty('mod_version_major', major.toString())
    props.setProperty('mod_version_minor', minor.toString())
    props.setProperty('mod_version_build', build.toString())
    propsFile.withOutputStream { props.store(it, null) }

    project.version = "${major}.${minor}.${build}"
    println "Building version ${project.version}"
}

tasks.register('release') {
    group = 'sunny-mod'
    description = 'Bump patch/build and build the jar'
    doFirst { bumpVersion('build') }
    finalizedBy('build')
}

tasks.register('releaseMinor') {
    group = 'sunny-mod'
    description = 'Bump minor (0.13.N → 0.14.0) and build the jar'
    doFirst { bumpVersion('minor') }
    finalizedBy('build')
}

tasks.register('releaseMajor') {
    group = 'sunny-mod'
    description = 'Bump major (0.N.x → 1.0.0) and build the jar'
    doFirst { bumpVersion('major') }
    finalizedBy('build')
}